<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Zencast">
  <!-- A dark Vesper tile: a peach Z typed before a mint caret, as in a command input. The Z draws in, then the caret blinks twice and rests. -->
  <style>
    .z { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards; }
    .glow { opacity: 0; animation: glow 0.6s ease-out 0.8s forwards; }
    .caret { animation: blink 1s steps(1) 0.9s 2; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes glow { to { opacity: 0.45; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .z { animation: none; stroke-dashoffset: 0; }
      .glow { animation: none; opacity: 0.45; }
      .caret { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c" />
      <stop offset="1" stop-color="#0c0c0c" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2c8" />
      <stop offset="1" stop-color="#ffb57a" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" /></filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)" />
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#rim)" />

  <path class="glow" d="M33 43H77L33 85H77" fill="none" stroke="#ffc799" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" />
  <path class="z" pathLength="1" d="M33 43H77L33 85H77" fill="none" stroke="url(#ink)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <path class="caret" d="M95 39V89" stroke="#99ffe4" stroke-width="7" stroke-linecap="round" />
</svg>
