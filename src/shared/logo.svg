<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zencast">
  <!-- An enso (Zen's brush circle) left open where a ray is cast out. Draws in once, then rests. -->
  <style>
    .enso { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.9s cubic-bezier(0.6, 0, 0.3, 1) 0.1s forwards; }
    .ray { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.35s ease-out 0.85s forwards; }
    .spark { opacity: 0; transform-origin: 49.6px 10.6px; animation: spark 0.4s ease-out 1.1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes spark { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .enso, .ray, .spark { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#121212" stroke="#2a2a2a" stroke-width="2" />
  <path class="enso" pathLength="1" d="M45.04 28.53 A16 16 0 1 1 32.78 18.24" fill="none" stroke="#ffc799" stroke-width="5.5" stroke-linecap="round" />
  <path class="ray" pathLength="1" d="M42.5 19.1 L46.1 14.9" fill="none" stroke="#99ffe4" stroke-width="4.5" stroke-linecap="round" />
  <circle class="spark" cx="49.6" cy="10.6" r="2.4" fill="#c8b6ff" />
</svg>
