<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Zencast">
  <!-- A glossy peach tile with a bold Z and a cast spark. Plays once on load, then rests. -->
  <style>
    .mark { animation: mark 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.05s both; }
    .spark { transform-origin: 101px 27px; animation: spark 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) 0.4s both; }
    .shine { animation: shine 0.9s ease-in-out 0.55s both; }
    @keyframes mark { from { opacity: 0; transform: translate(-6px, 6px); } }
    @keyframes spark { from { opacity: 0; transform: scale(0.2) rotate(-90deg); } }
    @keyframes shine { from { transform: translateX(-150px); } to { transform: translateX(150px); } }
    @media (prefers-reduced-motion: reduce) {
      .mark, .spark, .shine { animation: none; }
      .shine { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb889" />
      <stop offset="0.5" stop-color="#ff8466" />
      <stop offset="1" stop-color="#e8475a" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="clip"><rect x="4" y="4" width="120" height="120" rx="30" /></clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)" />
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#gloss)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" />

  <g class="mark"><g transform="translate(-2 0) skewX(-10) translate(7 0)">
    <path d="M38 37h52v13L59 79h31v13H36V79l31-29H38z" fill="#8c1f35" fill-opacity="0.3" transform="translate(0 4)" stroke="#8c1f35" stroke-opacity="0.3" stroke-width="5" stroke-linejoin="round" />
    <path d="M38 37h52v13L59 79h31v13H36V79l31-29H38z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round" />
  </g></g>
  <path class="spark" d="M101 15c1.2 7 4.9 10.8 12 12-7.1 1.2-10.8 5-12 12-1.2-7-4.9-10.8-12-12 7.1-1.2 10.8-5 12-12z" fill="#fff" />

  <g clip-path="url(#clip)">
    <rect class="shine" x="14" y="-20" width="34" height="170" fill="url(#band)" transform="rotate(20 64 64)" />
  </g>
</svg>
